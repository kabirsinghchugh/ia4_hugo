<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
<head>
    {{ partial "head.html" . }}
</head>
<body class="{{ if .IsHome }}home{{ else }}{{ .Type }}{{ end }}">
    {{ partial "header.html" . }}
    
    <div id="primary" class="content-area">
        <main id="main" class="site-main" role="main">
            {{ block "main" . }}{{ end }}
        </main>
    </div>
    
    {{ partial "footer.html" . }}
</body>
</html>
