<a class="skip-link screen-reader-text" href="#content">
    Skip to content
</a>
<div class="container">
    <header id="masthead" class="site-header" role="banner">
        <div class="center">
            <div class="cols table logo-and-navigation">
                <div class="col small table-cell">
                    <div class="header-bg site-branding">
                        <div id="logo">
                            <a href="{{ .Site.BaseURL }}" rel="home" aria-label="Home" class="header-logo">
                                <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <rect width="40" height="40" rx="8" fill="#333"/>
                                    <text x="20" y="26" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">iA</text>
                                </svg>
                            </a>
                            <a href="{{ .Site.BaseURL }}" rel="home" aria-label="Home" class="header-text">
                                <span class="header-title-text">{{ .Site.Title }}</span>
                                <span class="header-description-text">{{ .Site.Params.description }}</span>
                            </a>
                            <div class="theme-toggle-wrapper">
                                <button class="theme-toggle js-theme-toggle" type="button" aria-pressed="false" aria-label="Toggle dark mode">
                                    <span class="theme-toggle__track" aria-hidden="true">
                                        <span class="theme-toggle__thumb"></span>
                                    </span>
                                </button>
                            </div>
                            <button class="mobile-menu mobile-menu--has-logo js-action menu-toggle" data-action="toggleMenu" aria-controls="site-sidebar" aria-expanded="false" type="button">
                                <span class="menu-toggle__icon" aria-hidden="true"></span>
                                <span class="screen-reader-text">Open menu</span>
                            </button>
                        </div>
                    </div>
                </div>
                <div class="col large table-cell">
                    <div class="navigation original">
                        <div class="menu-wrapper">
                            <nav id="site-navigation" class="main-navigation">
                                <div class="main-menu-wrapper">
                                    <div class="search-field">
                                        <input type="text" name="searchterm" value="" class="js-search" id="searchterm" aria-label="Search Terms" autocomplete="off">
                                        <a data-action="toggleSearch" class="js-action-toggleSearch search-x" href="#">×</a>
                                    </div>
                                    <ul id="main-menu" class="menu">
                                        {{ range .Site.Menus.main }}
                                        <li><a href="{{ .URL }}">{{ .Name }}</a></li>
                                        {{ end }}
                                        <li id="search-box" class="search">
                                            <a data-action="toggleSearch" class="js-action-toggleSearch search-text" href="#" aria-label="Search">
                                                <img src="{{ "img/icn-search.svg" | relURL }}" alt="" class="search-icon">
                                            </a>
                                        </li>
                                    </ul>
                                </div>
                            </nav>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>
    <aside id="site-sidebar" class="site-sidebar" aria-hidden="true">
        <div class="site-sidebar__inner">
            <button class="site-sidebar__close js-action" data-action="toggleMenu" type="button">
                Close
            </button>
            <nav class="site-sidebar__nav" aria-label="Sidebar">
                <ul class="site-sidebar__menu">
                    {{ range .Site.Menus.main }}
                    <li><a href="{{ .URL }}"{{ with .Params.target }} target="{{ . }}" rel="noopener"{{ end }}>{{ .Name }}</a></li>
                    {{ end }}
                    <li><a data-action="toggleSearch" class="js-action-toggleSearch" href="#">Search</a></li>
                </ul>
            </nav>
            <div class="site-sidebar__note">
                <p>Minimal index of posts, portfolio work, and dashboard updates.</p>
            </div>
        </div>
    </aside>
    <div class="sidebar-scrim js-action" data-action="toggleMenu" aria-hidden="true"></div>
    <div id="result"></div>
    <div id="content" class="site-content">
